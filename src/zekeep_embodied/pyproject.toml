[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[project]
name = "zekeep-embodied"
version = "0.1.0"
description = "Timestamped Zekeep demonstrations and offline LeRobot export"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=2,<2.3", "opencv-python-headless>=4.12,<4.13", "PyYAML>=6,<7"]

[project.scripts]
zekeep-record = "zekeep_embodied.record:main"
zekeep-dataset = "zekeep_embodied.dataset:main"

[tool.setuptools.packages.find]
where = ["src"]
