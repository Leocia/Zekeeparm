camera:
  type: orbbec_gemini2
  serial: ""
  color_width: 1280
  color_height: 800
  fps: 30
  preset_json: config/camera/orbbec_gemini2_viewer.json
  color_distortion_mode: zero

calibration:
  installation_id: ""
  target_type: aruco
  aruco: { marker_length_m: 0.1, dict_id: 0, target_marker_id: 0 }
  charuco:
    squares_x: 12
    squares_y: 9
    square_length_m: 0.015
    marker_length_m: 0.01125
    dict_id: 5
    min_corners: 12
    max_reprojection_rmse_px: 1.0
  hand_eye_method: PARK
  quality: { max_translation_rmse_m: 0.010, max_rotation_rmse_deg: 3.0 }

detection:
  conf_threshold: 0.3
  iou_threshold: 0.45

yolo:
  model_name: "yoloe-26l-seg.pt"
  color_calibration: config/calibration/orbbec_gemini2/block_colors.json
  device: "0"
  imgsz: 1280
  use_world: true
  custom_classes:
    - "red block"
    - "blue block"
    - "green block"
    - "purple block"
    - "gray block"
    - "block"
    - "pen"
    - "cardboard box"
    - "paper cup"
    - "transparent tape roll"
    - "tissue box"
    - "tissue paper"

robot:
  id: ""
  repo_root: ../../zekeeparm_SDK
  urdf_path: ../zekeep_bringup/description/urdf/sixaxis.urdf
  grasp_reference_frame: grasp_tcp
  end_effector_frame: gripper_base
  namespace: zekeep
  joint_state_topic: /zekeep/joint_states
  ros_timeout_s: 8.0
  joint_state_max_age_s: 0.5
  rgbd_joint_sync_tolerance_s: 0.50
  gripper_max_width_m: 0.06517241379310346
  joint_mapping:
    joint1: {direction: -1, gear_ratio: 1.0, encoder_zero: 0.0, model_zero: 0.0, lower: -2.58, upper: 2.58}
    joint2: {direction: -1, gear_ratio: 1.0, encoder_zero: 0.0, model_zero: 0.0, lower: 0.0, upper: 3.70}
    joint3: {direction: -1, gear_ratio: 1.0, encoder_zero: 0.0, model_zero: 0.0, lower: -0.01, upper: 3.70}
    joint4: {direction: -1, gear_ratio: 1.0, encoder_zero: 0.0, model_zero: 0.0, lower: -1.57, upper: 1.57}
    joint5: {direction: -1, gear_ratio: 1.0, encoder_zero: 0.0, model_zero: 0.0, lower: -1.57, upper: 1.57}
    joint6: {direction: -1, gear_ratio: 1.0, encoder_zero: 0.0, model_zero: 0.0, lower: -1.57, upper: 1.57}
  moveit:
    planning_pipeline_id: ompl
    planner_id: RRTConnect
    planning_attempts: 10
    planning_time_s: 8.0
    pregrasp_collision_fallback_raise_m: 0.030
    joint_goal_tolerance_rad: 0.005
    max_velocity_scaling_factor: 0.45
    max_acceleration_scaling_factor: 0.30
    cartesian_max_step_m: 0.003
    cartesian_fallback_min_fraction: 0.90
    revolute_jump_threshold_rad: 0.25
    worktable_width_m: 0.9
    worktable_length_m: 1.2
    worktable_mount_inset_m: 0.062
    worktable_thickness_m: 0.020
  gripper:
    dm:
      angle_open: 1.30
      counterclockwise: false
      tau_max: 1.5
      close_torque: 1.0
      default_force: 0.30
      contact_torque: 0.10
  ready_pose:
    x: 0.266538
    y: 0.000001
    z: 0.208550
    roll: -1.570884
    pitch: 0.610873
    yaw: 0.000008
    duration: 4.0

official_sdk:
  sdk_private_api_version: 1
  arm_control_mode: posvel
  mit_kp: [200, 200, 200, 54, 54, 54]
  mit_kd: [8, 8, 8, 2, 2, 2]
  gravity_tau_scale: [1.0, 1.10, 1.0, 1.0, 1.0, 1.0]
  gravity_tau_scale_positive: [1.0, 1.10, 1.10, 1.0, 1.0, 1.0]
  socket_path: /tmp/zekeep_sdk.sock
  request_timeout_s: 30.0
  tcp_frame: official_tcp
  urdf: config/sixaxis.urdf
  ready_joints: [0.0, 0.698132, 0.698132, -0.610865, 0.0, 0.0]
  workspace:
    x: [0.10, 0.55]
    y: [-0.35, 0.35]
    z: [0.005, 0.60]
  max_segment_joint_delta_rad: 1.6
  segment_duration_s: 2.67
  transit_duration_s: 1.67

place:
  enabled: false
  mode: fixed_joint
  # Retained reference targets; verify this installation before enabling placement.
  joint_target_rad: [-1.3040743, 1.6420612, 1.3582439, -1.2678337, 0.0356684, -0.0741968]
  pre_grasp_wait_s: 1.0
  post_grasp_wait_s: 1.0
  post_grasp_lift_m: 0.10
  pre_release_wait_s: 1.0
  post_release_wait_s: 1.0
  named_joint_targets_rad:
    red_place:   [0.9042873382568359, 1.4967193603515625, 0.8607997894287109, -0.2733268737792969, -0.2607383728027344, -0.10509681701660156]
    blue_place:  [0.7135496139526367, 1.7694740295410156, 1.2647819519042969, -0.3179597854614258, -0.08258914947509766, 0.09708595275878906]
    green_place: [0.5384531021118164, 2.2215232849121094, 1.835087776184082, -0.3858623504638672, -0.07495975494384766, 0.10433387756347656]
  class_targets:
    red block: red_place
    blue block: blue_place
    green block: green_place
  joint_duration_s: 2.67
  return_ready_after_release: true
  return_duration_s: 2.67

grasp_pipeline:
  infer_every_live: 3
  planning_budget_s: 25.0
  candidate_search_budget_s: 5.0
  final_planning_reserve_s: 15.0
  maximum_planning_candidates: 6
  ik:
    backend: custom
    max_iterations: 600
    multistart_retries: 24
    candidate_max_iterations: 250
    candidate_multistart_retries: 2
    timeout_s: 0.25
  shape_yaw:
    enabled: true
    minimum_points: 200
    minimum_anisotropy: 1.35
    minimum_major_span_m: 0.012
    minimum_minor_span_m: 0.004
  cube:
    graspnet_fallback_enabled: true
    enforce_size_bounds: false
  grasp:
    depth_quantile: 0.5
    pregrasp_offset_m: 0.080
    retreat_offset_m: 0.080
    transit_clearance_m: 0.060
    local_yaw_search_deg: [0, 180, -5, 5]
    oblique_first_radius_m: 0.43

safety:
  max_downward_grasp_tilt_deg: 45.0
  table_collision_enabled: true
  table_z_m: 0.0
  table_clearance_m: 0.005
  environment_clearance_m: 0.004
  gripper_self_filter_distance_m: 0.015
  target_depth_tolerance_m: 0.040
  target_mask_dilation_px: 5

graspnet:
  checkpoint: "checkpoint-rs.tar"
  num_point: 20000
  collision_thresh: 0.01
  nms_translation_thresh_m: 0.005
  nms_rotation_thresh_deg: 10.0
  min_depth: 0.05
  max_depth: 1.2
  top_k: 20
  target_margin_px: 12
  target_center_score_weight: 0.20
  target_min_mask_support: 0.80
  target_min_valid_depth_fraction: 0.80
  target_max_local_depth_deviation_m: 0.005
  target_max_center_depth_error_m: 0.015
